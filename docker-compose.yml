services:
  postgres:
    image: postgres:16
    container_name: p10_kestra_postgres
    volumes:
      - p10-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kestra}
      POSTGRES_USER: ${POSTGRES_USER:-kestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k3str4_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $ -U $"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:${KESTRA_VERSION:-latest}
    container_name: p10_kestra_orchestrator
    user: "root"
    command: server standalone
    volumes:
      - p10-kestra-data:/app/storage
      - ./data:/data
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kestra}
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER:-kestra}
            password: ${POSTGRES_PASSWORD:-k3str4_password}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.python.Script
                values:
                  taskRunner:
                    type: io.kestra.plugin.core.runner.Process
              - type: io.kestra.plugin.scripts.python.Commands
                values:
                  taskRunner:
                    type: io.kestra.plugin.core.runner.Process
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  p10-postgres-data:
  p10-kestra-data:

