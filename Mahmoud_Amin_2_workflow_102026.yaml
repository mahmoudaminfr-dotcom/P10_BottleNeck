id: bottleneck_pipeline
namespace: bottleneck.production
description: "Pipeline d'orchestration des flux BottleNeck (ETL DuckDB & Python avec Publication Atomique par Lot et Tests Complets)"

inputs:
  - id: mode_validation
    type: SELECT
    displayName: "Mode de contrÃ´le qualitÃ© (Recette initiale ou Production mensuelle)"
    description: "RECETTE_INITIALE vÃ©rifie les seuils fixes du jeu d'essai (714 produits, 70568.60 EUR, 30 premium). PRODUCTION_MENSUELLE applique les invariants dynamiques."
    defaults: RECETTE_INITIALE
    values:
      - RECETTE_INITIALE
      - PRODUCTION_MENSUELLE

retry:
  type: constant
  interval: PT10S
  maxAttempts: 3

tasks:
  - id: t1_ingestion_et_nettoyage
    type: io.kestra.plugin.scripts.python.Script
    description: "Tache 1 : Verification des sources, initialisation du staging et suppression des valeurs manquantes (SQL)"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
      - pandas
      - openpyxl
    script: |
      import os
      import shutil
      import warnings
      import duckdb
      import pandas as pd

      warnings.filterwarnings("ignore", category=UserWarning, module="openpyxl")

      input_dir = "/data/inputs"
      staging_dir = "/data/outputs/.staging_{{ execution.id }}"
      if os.path.exists(staging_dir):
          shutil.rmtree(staging_dir)
      os.makedirs(staging_dir, exist_ok=True)

      files = {
          "erp": os.path.join(input_dir, "Fichier_erp.xlsx"),
          "liaison": os.path.join(input_dir, "fichier_liaison.xlsx"),
          "web": os.path.join(input_dir, "Fichier_web.xlsx")
      }

      for name, path in files.items():
          if not os.path.exists(path) or os.path.getsize(path) == 0:
              raise FileNotFoundError(f"Fichier source manquant ou vide : {path}")

      df_erp = pd.read_excel(files["erp"])
      df_liaison = pd.read_excel(files["liaison"], dtype={"id_web": str})
      df_web = pd.read_excel(files["web"], dtype={"sku": str})

      db_path = os.path.join(staging_dir, "bottleneck.duckdb")
      with duckdb.connect(db_path) as con:
          con.execute("CREATE OR REPLACE TABLE raw_erp AS SELECT * FROM df_erp")
          con.execute("CREATE OR REPLACE TABLE raw_liaison AS SELECT * FROM df_liaison")
          con.execute("CREATE OR REPLACE TABLE raw_web AS SELECT * FROM df_web")

          con.execute("""
              CREATE OR REPLACE TABLE erp_clean AS
              SELECT * FROM raw_erp
              WHERE product_id IS NOT NULL;

              CREATE OR REPLACE TABLE liaison_clean AS
              SELECT * FROM raw_liaison
              WHERE product_id IS NOT NULL;

              CREATE OR REPLACE TABLE web_clean AS
              SELECT * FROM raw_web
              WHERE sku IS NOT NULL AND TRIM(sku) != '' AND LOWER(TRIM(sku)) != 'nan';
          """)

          c_erp = con.execute("SELECT COUNT(*) FROM erp_clean").fetchone()[0]
          c_liaison = con.execute("SELECT COUNT(*) FROM liaison_clean").fetchone()[0]
          c_web = con.execute("SELECT COUNT(*) FROM web_clean").fetchone()[0]
          print(f"[TACHE 1 OK] Staging cree ({staging_dir}) | Lignes nettoyees -> erp_clean: {c_erp} | liaison_clean: {c_liaison} | web_clean: {c_web}")

  - id: test1_valeurs_manquantes
    type: io.kestra.plugin.scripts.python.Script
    description: "TEST 1 : Verification d'absence de valeurs manquantes et controle de volumetrie"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      mode = "{{ inputs.mode_validation }}"
      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path, read_only=True) as con:
          null_erp = con.execute("SELECT COUNT(*) FROM erp_clean WHERE product_id IS NULL").fetchone()[0]
          null_liaison = con.execute("SELECT COUNT(*) FROM liaison_clean WHERE product_id IS NULL").fetchone()[0]
          null_web = con.execute("SELECT COUNT(*) FROM web_clean WHERE sku IS NULL OR TRIM(sku) = '' OR LOWER(TRIM(sku)) = 'nan'").fetchone()[0]
          count_erp = con.execute("SELECT COUNT(*) FROM erp_clean").fetchone()[0]
          count_liaison = con.execute("SELECT COUNT(*) FROM liaison_clean").fetchone()[0]
          count_web = con.execute("SELECT COUNT(*) FROM web_clean").fetchone()[0]

      if null_erp > 0 or null_liaison > 0 or null_web > 0:
          raise ValueError(f"[TEST 1 KO] Valeurs NULL detectees ! erp: {null_erp}, liaison: {null_liaison}, web: {null_web}")

      if count_erp == 0 or count_liaison == 0 or count_web == 0:
          raise AssertionError(f"[TEST 1 KO] Une table nettoyee est vide : erp={count_erp}, liaison={count_liaison}, web={count_web}")

      if mode == "RECETTE_INITIALE" and count_web != 1428:
          raise AssertionError(f"[TEST 1 KO - RECETTE] Volumetrie web_clean incorrecte : {count_web} lignes (attendu: 1428)")

      print(f"[TEST 1 OK] Mode={mode} | 0 NULL sur les cles & web_clean = {count_web} lignes.")

  - id: t2_dedoublonnage
    type: io.kestra.plugin.scripts.python.Script
    description: "Tache 2 : Dedoublonnage SQL avec DuckDB des 3 tables (erp, liaison, web)"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path) as con:
          con.execute("""
              CREATE OR REPLACE TABLE erp_dedup AS
              SELECT * FROM erp_clean
              QUALIFY ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY product_id) = 1;

              CREATE OR REPLACE TABLE liaison_dedup AS
              SELECT * FROM liaison_clean
              QUALIFY ROW_NUMBER() OVER (PARTITION BY product_id ORDER BY product_id) = 1;

              CREATE OR REPLACE TABLE web_dedup AS
              SELECT * FROM web_clean
              WHERE post_type = 'product'
              QUALIFY ROW_NUMBER() OVER (PARTITION BY sku ORDER BY post_date DESC) = 1;
          """)

          d_erp = con.execute("SELECT COUNT(*) FROM erp_dedup").fetchone()[0]
          d_liaison = con.execute("SELECT COUNT(*) FROM liaison_dedup").fetchone()[0]
          d_web = con.execute("SELECT COUNT(*) FROM web_dedup").fetchone()[0]
          print(f"[TACHE 2 OK] Lignes apres dedoublonnage -> erp_dedup: {d_erp} | liaison_dedup: {d_liaison} | web_dedup: {d_web}")

  - id: test2_unicite_dedoublonnage
    type: io.kestra.plugin.scripts.python.Script
    description: "TEST 2 : Verification de l'absence de doublons et de l'unicite des cles primaires"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      mode = "{{ inputs.mode_validation }}"
      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path, read_only=True) as con:
          erp_tot, erp_dist = con.execute("SELECT COUNT(*), COUNT(DISTINCT product_id) FROM erp_dedup").fetchone()
          lia_tot, lia_dist = con.execute("SELECT COUNT(*), COUNT(DISTINCT product_id) FROM liaison_dedup").fetchone()
          web_tot, web_dist = con.execute("SELECT COUNT(*), COUNT(DISTINCT sku) FROM web_dedup").fetchone()

      if erp_tot != erp_dist or lia_tot != lia_dist or web_tot != web_dist:
          raise ValueError(f"[TEST 2 KO] Doublons detectes ! erp:{erp_tot}/{erp_dist}, liaison:{lia_tot}/{lia_dist}, web:{web_tot}/{web_dist}")

      if mode == "RECETTE_INITIALE" and (erp_tot != 825 or lia_tot != 825 or web_tot != 714):
          raise AssertionError(f"[TEST 2 KO - RECETTE] Volumetrie apres dedoublonnage non conforme : erp={erp_tot}, liaison={lia_tot}, web={web_tot}")

      print(f"[TEST 2 OK] Mode={mode} | 0 doublon & cles uniques validees -> erp: {erp_tot} | liaison: {lia_tot} | web: {web_tot}")

  - id: t3_fusion_jointure
    type: io.kestra.plugin.scripts.python.Script
    description: "Tache 3 : Reconciliation et fusion SQL (INNER JOIN) erp + liaison + web via DuckDB"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path) as con:
          con.execute("""
              CREATE OR REPLACE TABLE erp_web_merged AS
              SELECT
                  e.product_id,
                  l.id_web,
                  w.sku,
                  w.post_title,
                  e.onsale_web,
                  e.price,
                  e.stock_quantity,
                  e.stock_status,
                  w.total_sales,
                  w.rating_count,
                  w.average_rating,
                  w.post_date
              FROM erp_dedup e
              INNER JOIN liaison_dedup l
                  ON e.product_id = l.product_id
              INNER JOIN web_dedup w
                  ON CAST(l.id_web AS VARCHAR) = CAST(w.sku AS VARCHAR);
          """)

          m_count = con.execute("SELECT COUNT(*) FROM erp_web_merged").fetchone()[0]
          print(f"[TACHE 3 OK] Lignes dans la table fusionnee (erp_web_merged) : {m_count}")

  - id: test3_coherence_jointure
    type: io.kestra.plugin.scripts.python.Script
    description: "TEST 3 : Verification de la coherence de la jointure (integrite referentielle, 0 NULL, price > 0)"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      mode = "{{ inputs.mode_validation }}"
      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path, read_only=True) as con:
          m_tot, m_dist = con.execute("SELECT COUNT(*), COUNT(DISTINCT product_id) FROM erp_web_merged").fetchone()
          web_tot = con.execute("SELECT COUNT(*) FROM web_dedup").fetchone()[0]
          null_metrics = con.execute("SELECT COUNT(*) FROM erp_web_merged WHERE price IS NULL OR total_sales IS NULL").fetchone()[0]
          invalid_prices = con.execute("SELECT COUNT(*) FROM erp_web_merged WHERE price <= 0").fetchone()[0]
          invalid_sales = con.execute("SELECT COUNT(*) FROM erp_web_merged WHERE total_sales < 0").fetchone()[0]

      if m_tot == 0 or m_tot != m_dist or m_tot != web_tot:
          raise AssertionError(f"[TEST 3 KO] Jointure incoherente : fusion={m_tot} ({m_dist} uniques) vs web_dedup={web_tot}")

      if null_metrics > 0 or invalid_prices > 0 or invalid_sales > 0:
          raise ValueError(f"[TEST 3 KO] Anomalies metriques : nulls={null_metrics}, prix<=0={invalid_prices}, ventes<0={invalid_sales}")

      if mode == "RECETTE_INITIALE" and m_tot != 714:
          raise AssertionError(f"[TEST 3 KO - RECETTE] Volumetrie jointure attendue=714, obtenue={m_tot}")

      print(f"[TEST 3 OK] Mode={mode} | Jointure validee : {m_tot} produits reconcilies, 0 NULL et 100% des prix > 0.")

  - id: t4a_calcul_ca
    type: io.kestra.plugin.scripts.python.Script
    description: "Tache 4A : Calcul SQL (DuckDB) du CA par produit et du CA Total (ecriture sequencee)"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path) as con:
          con.execute("""
              CREATE OR REPLACE TABLE ca_par_produit AS
              SELECT
                  product_id,
                  sku,
                  post_title,
                  price,
                  total_sales,
                  ROUND(price * total_sales, 2) AS chiffre_affaires
              FROM erp_web_merged
              ORDER BY chiffre_affaires DESC;

              CREATE OR REPLACE TABLE ca_global AS
              SELECT
                  COUNT(*) AS nb_produits,
                  SUM(total_sales) AS total_bouteilles_vendues,
                  ROUND(SUM(chiffre_affaires), 2) AS chiffre_affaires_total
              FROM ca_par_produit;
          """)

          ca_tot = con.execute("SELECT chiffre_affaires_total FROM ca_global").fetchone()[0]
          nb_prod = con.execute("SELECT COUNT(*) FROM ca_par_produit").fetchone()[0]
          print(f"[TACHE 4A OK] Produits calcules : {nb_prod} | Chiffre d'affaires Total : {ca_tot:.2f} EUR")

  - id: test4a_coherence_ca
    type: io.kestra.plugin.scripts.python.Script
    description: "TEST 4A : Controle des invariants financiers (CA = prix x ventes, Somme CA) + Recette (70568.60 EUR)"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      mode = "{{ inputs.mode_validation }}"
      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path, read_only=True) as con:
          nb_merged = con.execute("SELECT COUNT(*) FROM erp_web_merged").fetchone()[0]
          nb_lignes = con.execute("SELECT COUNT(*) FROM ca_par_produit").fetchone()[0]
          neg_ca = con.execute("SELECT COUNT(*) FROM ca_par_produit WHERE chiffre_affaires < 0 OR chiffre_affaires IS NULL").fetchone()[0]
          bad_formula = con.execute("""
              SELECT COUNT(*) FROM ca_par_produit
              WHERE ABS(chiffre_affaires - ROUND(price * total_sales, 2)) > 0.001
          """).fetchone()[0]
          sum_lines = con.execute("SELECT ROUND(SUM(chiffre_affaires), 2) FROM ca_par_produit").fetchone()[0]
          ca_tot = con.execute("SELECT chiffre_affaires_total FROM ca_global").fetchone()[0]

      if nb_lignes != nb_merged:
          raise AssertionError(f"[TEST 4A KO] Nombre de produits incoherent : {nb_lignes} vs {nb_merged}")

      if neg_ca > 0 or bad_formula > 0:
          raise ValueError(f"[TEST 4A KO] Formule CA invalide : neg_ou_null={neg_ca}, ecart_prix_x_ventes={bad_formula}")

      if round(float(sum_lines), 2) != round(float(ca_tot), 2):
          raise AssertionError(f"[TEST 4A KO] Incoherence Somme(CA_produit)={sum_lines} vs CA_Total={ca_tot}")

      if mode == "RECETTE_INITIALE" and (nb_lignes != 714 or round(float(ca_tot), 2) != 70568.60):
          raise AssertionError(f"[TEST 4A KO - RECETTE] Attendu: 714 produits & 70568.60 EUR | Obtenu: {nb_lignes} & {ca_tot} EUR")

      print(f"[TEST 4A OK] Mode={mode} | Formule CA=prix*ventes & Somme validees : {nb_lignes} produits, CA Total = {ca_tot:.2f} EUR.")

  - id: t4b_calcul_zscore
    type: io.kestra.plugin.scripts.python.Script
    description: "Tache 4B : Calcul Python du Z-Score des prix et affectation du segment (ecriture sequencee)"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
      - pandas
    script: |
      import duckdb
      import pandas as pd

      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path) as con:
          df = con.execute("SELECT * FROM erp_web_merged").df()

          prices = df["price"]
          mean_price = prices.mean()
          std_price = prices.std(ddof=0)
          if std_price == 0 or pd.isna(std_price):
              raise ValueError("Ecart-type des prix nul ou invalide, calcul du Z-Score impossible.")

          df["z_score"] = (prices - mean_price) / std_price
          df["segment"] = df["z_score"].apply(lambda z: "premium" if z > 2 else "ordinaire")
          con.execute("CREATE OR REPLACE TABLE erp_web_zscore AS SELECT * FROM df")

      print(f"[TACHE 4B OK] Z-Score des prix calcule pour {len(df)} produits (Moyenne: {mean_price:.2f} EUR, Ecart-type: {std_price:.2f} EUR)")

  - id: test4b_coherence_zscore
    type: io.kestra.plugin.scripts.python.Script
    description: "TEST 4B : Verification de la partition complete des segments Z-Score + Recette (30 Premium / 684 Ordinaires)"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
    script: |
      import duckdb

      mode = "{{ inputs.mode_validation }}"
      db_path = "/data/outputs/.staging_{{ execution.id }}/bottleneck.duckdb"
      with duckdb.connect(db_path, read_only=True) as con:
          nb_merged = con.execute("SELECT COUNT(*) FROM erp_web_merged").fetchone()[0]
          total = con.execute("SELECT COUNT(*) FROM erp_web_zscore").fetchone()[0]
          null_z = con.execute("SELECT COUNT(*) FROM erp_web_zscore WHERE z_score IS NULL OR isnan(z_score)").fetchone()[0]
          premium = con.execute("SELECT COUNT(*) FROM erp_web_zscore WHERE z_score > 2 AND segment = 'premium'").fetchone()[0]
          ordinaire = con.execute("SELECT COUNT(*) FROM erp_web_zscore WHERE z_score <= 2 AND segment = 'ordinaire'").fetchone()[0]

      if null_z > 0:
          raise ValueError(f"[TEST 4B KO] {null_z} valeurs de z_score NULL ou NaN detectees.")

      if total != nb_merged or (premium + ordinaire) != total:
          raise AssertionError(f"[TEST 4B KO] Partition incomplete : Premium({premium}) + Ordinaire({ordinaire}) != Total({total})")

      if mode == "RECETTE_INITIALE" and (total != 714 or premium != 30 or ordinaire != 684):
          raise AssertionError(f"[TEST 4B KO - RECETTE] Attendu 30 Premium / 684 Ordinaires (714) | Obtenu {premium} / {ordinaire} ({total})")

      print(f"[TEST 4B OK] Mode={mode} | Partition Z-Score validee -> Vins Premium (prix z > 2): {premium} | Vins Ordinaires (z <= 2): {ordinaire} | Total: {total}")

  - id: exports_paralleles_staging
    type: io.kestra.plugin.core.flow.Parallel
    description: "Seule etape parallele : Lectures DuckDB (read_only) et generation simultanee des exports Excel et CSV en staging"
    tasks:
      - id: ext_rapport_ca_xlsx
        type: io.kestra.plugin.scripts.python.Script
        description: "Generation en staging du rapport financier Excel (.xlsx) avec 2 onglets (CA par produit & CA Total)"
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        dependencies:
          - duckdb
          - pandas
          - openpyxl
        script: |
          import duckdb
          import pandas as pd

          staging_dir = "/data/outputs/.staging_{{ execution.id }}"
          db_path = f"{staging_dir}/bottleneck.duckdb"
          excel_path = f"{staging_dir}/rapport_chiffre_affaires.xlsx"

          with duckdb.connect(db_path, read_only=True) as con:
              df_ca_prod = con.execute("SELECT * FROM ca_par_produit").df()
              df_ca_glob = con.execute("SELECT * FROM ca_global").df()

          with pd.ExcelWriter(excel_path, engine="openpyxl") as writer:
              df_ca_prod.to_excel(writer, sheet_name="CA_par_produit", index=False)
              df_ca_glob.to_excel(writer, sheet_name="CA_Total", index=False)

          print(f"[STAGING EXCEL OK] {excel_path} ({len(df_ca_prod)} produits)")

      - id: ext_exports_csv
        type: io.kestra.plugin.scripts.python.Script
        description: "Generation en staging des fichiers CSV (vins_premium.csv & vins_ordinaires.csv)"
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        dependencies:
          - duckdb
          - pandas
        script: |
          import duckdb
          import pandas as pd

          staging_dir = "/data/outputs/.staging_{{ execution.id }}"
          db_path = f"{staging_dir}/bottleneck.duckdb"

          with duckdb.connect(db_path, read_only=True) as con:
              df = con.execute("SELECT * FROM erp_web_zscore").df()

          df_premium = df[df["z_score"] > 2].copy()
          df_ordinaire = df[df["z_score"] <= 2].copy()

          df_premium.to_csv(f"{staging_dir}/vins_premium.csv", index=False, encoding="utf-8")
          df_ordinaire.to_csv(f"{staging_dir}/vins_ordinaires.csv", index=False, encoding="utf-8")

          print(f"[STAGING CSV OK] vins_premium.csv ({len(df_premium)} lignes) & vins_ordinaires.csv ({len(df_ordinaire)} lignes)")

  - id: test5_et_publication_atomique
    type: io.kestra.plugin.scripts.python.Script
    description: "TEST 5 & PUBLICATION : Verification approfondie du contenu des exports (formules, sommes, IDs, segments) puis bascule atomique du dossier complet"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    dependencies:
      - duckdb
      - pandas
      - openpyxl
    script: |
      import os
      import shutil
      import duckdb
      import pandas as pd

      exec_id = "{{ execution.id }}"
      output_dir = "/data/outputs"
      staging_dir = os.path.join(output_dir, f".staging_{exec_id}")

      db_staging = os.path.join(staging_dir, "bottleneck.duckdb")
      xlsx_staging = os.path.join(staging_dir, "rapport_chiffre_affaires.xlsx")
      prem_staging = os.path.join(staging_dir, "vins_premium.csv")
      ord_staging = os.path.join(staging_dir, "vins_ordinaires.csv")

      # 1. Verification physique des fichiers en staging
      for fpath in [db_staging, xlsx_staging, prem_staging, ord_staging]:
          if not os.path.exists(fpath) or os.path.getsize(fpath) == 0:
              raise FileNotFoundError(f"[TEST 5 KO] Fichier d'export manquant ou vide en staging : {fpath}")

      # 2. Chargement des references depuis DuckDB
      with duckdb.connect(db_staging, read_only=True) as con:
          df_ref_ca = con.execute("SELECT product_id, sku, price, total_sales, chiffre_affaires FROM ca_par_produit").df()
          exp_ca_glob = round(float(con.execute("SELECT chiffre_affaires_total FROM ca_global").fetchone()[0]), 2)
          df_ref_z = con.execute("SELECT product_id, z_score, segment FROM erp_web_zscore").df()

      exp_total = len(df_ref_ca)
      ref_ids = set(df_ref_ca["product_id"].tolist())
      ref_prem_ids = set(df_ref_z[df_ref_z["z_score"] > 2]["product_id"].tolist())
      ref_ord_ids = set(df_ref_z[df_ref_z["z_score"] <= 2]["product_id"].tolist())

      # 3. Controle approfondi du contenu de l'Excel (CA individuel, somme des CA vs CA_Total, IDs)
      df_xlsx_prod = pd.read_excel(xlsx_staging, sheet_name="CA_par_produit")
      df_xlsx_glob = pd.read_excel(xlsx_staging, sheet_name="CA_Total")

      if len(df_xlsx_prod) != exp_total or set(df_xlsx_prod["product_id"].tolist()) != ref_ids:
          raise AssertionError("[TEST 5 KO] Incoherence des identifiants product_id ou du nombre de lignes dans l'onglet CA_par_produit.")

      # Verification ligne a ligne dans l'Excel : chiffre_affaires == ROUND(price * total_sales, 2)
      calc_ca_line = (df_xlsx_prod["price"] * df_xlsx_prod["total_sales"]).round(2)
      bad_lines = (df_xlsx_prod["chiffre_affaires"].round(2) - calc_ca_line).abs() > 0.001
      if bad_lines.any():
          raise AssertionError(f"[TEST 5 KO] {int(bad_lines.sum())} ligne(s) ont un CA individuel falsifie ou incoherent dans l'Excel !")

      # Comparaison exacte entre chaque CA individuel de l'Excel et la table DuckDB
      merged_check = pd.merge(
          df_xlsx_prod[["product_id", "chiffre_affaires"]],
          df_ref_ca[["product_id", "chiffre_affaires"]],
          on="product_id",
          suffixes=("_xlsx", "_db")
      )
      if ((merged_check["chiffre_affaires_xlsx"].round(2) - merged_check["chiffre_affaires_db"].round(2)).abs() > 0.001).any():
          raise AssertionError("[TEST 5 KO] Ecart detecte sur un CA individuel entre le fichier Excel et DuckDB !")

      # Comparaison entre la somme des CA par produit de l'Excel et le CA Total de l'Excel
      xlsx_sum_prod = round(float(df_xlsx_prod["chiffre_affaires"].sum()), 2)
      xlsx_ca_glob = round(float(df_xlsx_glob["chiffre_affaires_total"].iloc[0]), 2)
      if xlsx_sum_prod != xlsx_ca_glob or xlsx_ca_glob != exp_ca_glob:
          raise AssertionError(
              f"[TEST 5 KO] Incoherence des totaux Excel : Somme(CA_par_produit)={xlsx_sum_prod} vs CA_Total={xlsx_ca_glob} vs DuckDB={exp_ca_glob}"
          )

      # 4. Controle approfondi du contenu des CSV (identifiants product_id, partition, z_score et segments)
      df_prem = pd.read_csv(prem_staging)
      df_ord = pd.read_csv(ord_staging)

      prem_ids = set(df_prem["product_id"].tolist())
      ord_ids = set(df_ord["product_id"].tolist())

      if len(df_prem) != len(prem_ids) or len(df_ord) != len(ord_ids):
          raise AssertionError("[TEST 5 KO] Doublons de product_id detectes dans les fichiers CSV !")

      if (prem_ids & ord_ids):
          raise AssertionError("[TEST 5 KO] Chevauchement d'identifiants product_id entre vins_premium.csv et vins_ordinaires.csv !")

      if prem_ids != ref_prem_ids or ord_ids != ref_ord_ids or (prem_ids | ord_ids) != ref_ids:
          raise AssertionError("[TEST 5 KO] Les identifiants product_id des CSV ne correspondent pas exactement aux segments de DuckDB !")

      if (df_prem["z_score"] <= 2).any() or (df_ord["z_score"] > 2).any():
          raise AssertionError("[TEST 5 KO] Valeurs de z_score hors seuil detectees dans les CSV !")

      if "segment" not in df_prem.columns or "segment" not in df_ord.columns:
          raise AssertionError("[TEST 5 KO] Colonne 'segment' absente des exports CSV !")

      if not (df_prem["segment"] == "premium").all() or not (df_ord["segment"] == "ordinaire").all():
          raise AssertionError("[TEST 5 KO] Valeurs de la colonne 'segment' invalides dans les CSV !")

      # 5. Publication atomique d'un dossier complet par execution et bascule vers le dernier lot valide
      lots_root = os.path.join(output_dir, "lots")
      os.makedirs(lots_root, exist_ok=True)
      lot_dir = os.path.join(lots_root, f"lot_{exec_id}")

      # Bascule atomique (renommage OS instantane) du dossier de staging complet vers le lot valide
      if os.path.exists(lot_dir):
          shutil.rmtree(lot_dir)
      os.replace(staging_dir, lot_dir)

      # Mise a jour atomique du dossier 'dernier_lot_valide' (via preparation puis swap atomique)
      active_lot_dir = os.path.join(output_dir, "dernier_lot_valide")
      next_lot_tmp = os.path.join(output_dir, f".next_lot_{exec_id}")
      prev_lot_bak = os.path.join(output_dir, f".prev_lot_{exec_id}")

      if os.path.exists(next_lot_tmp):
          shutil.rmtree(next_lot_tmp)
      shutil.copytree(lot_dir, next_lot_tmp)

      # Si une erreur survenait pendant copytree ci-dessus, 'dernier_lot_valide' n'est pas touche.
      # Le swap ci-dessous utilise uniquement os.replace (renommage de repertoire atomique) :
      if os.path.exists(prev_lot_bak):
          shutil.rmtree(prev_lot_bak)
      if os.path.exists(active_lot_dir):
          os.replace(active_lot_dir, prev_lot_bak)
      os.replace(next_lot_tmp, active_lot_dir)
      if os.path.exists(prev_lot_bak):
          shutil.rmtree(prev_lot_bak, ignore_errors=True)

      # Pointeur atomique indiquant l'identifiant et le chemin du dernier lot valide
      pointer_tmp = os.path.join(output_dir, f".pointer_{exec_id}.tmp")
      pointer_final = os.path.join(output_dir, "LAST_VALID_LOT.txt")
      with open(pointer_tmp, "w", encoding="utf-8") as f:
          f.write(f"lot_{exec_id}\n{lot_dir}\n")
      os.replace(pointer_tmp, pointer_final)

      # Synchronisation atomique des fichiers a la racine de /data/outputs depuis le lot deja valide
      for fname in ["bottleneck.duckdb", "rapport_chiffre_affaires.xlsx", "vins_premium.csv", "vins_ordinaires.csv"]:
          src_file = os.path.join(active_lot_dir, fname)
          tmp_file = os.path.join(output_dir, f".tmp_{exec_id}_{fname}")
          dst_file = os.path.join(output_dir, fname)
          shutil.copy2(src_file, tmp_file)
          os.replace(tmp_file, dst_file)

      print(f"[TEST 5 & PUBLICATION ATOMIQUE OK] Lot complet 'lot_{exec_id}' valide et bascule sur '{active_lot_dir}' ({exp_total} produits, Somme CA={xlsx_sum_prod:.2f} EUR, {len(df_prem)} premium / {len(df_ord)} ordinaires).")

errors:
  - id: nettoyage_staging_et_alerte
    type: io.kestra.plugin.scripts.python.Script
    description: "Nettoyage des fichiers temporaires de staging et journalisation d'une ligne d'alerte dans les logs Kestra"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import os
      import shutil
      import sys

      exec_id = "{{ execution.id }}"
      output_dir = "/data/outputs"
      for d in [f".staging_{exec_id}", f".next_lot_{exec_id}"]:
          p = os.path.join(output_dir, d)
          if os.path.exists(p):
              shutil.rmtree(p, ignore_errors=True)

      print(f"[ALERTE INCIDENT BOTTLENECK] Echec du pipeline ({{ flow.id }}) lors de l'execution {exec_id}. Le dossier de staging a ete purge : le dernier lot valide dans /data/outputs/dernier_lot_valide est reste 100% intact (alerte tracee dans les logs Kestra uniquement).", file=sys.stderr)

triggers:
  - id: planification_mensuelle_15_du_mois
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 15 * *"
    timezone: Europe/Paris
    inputs:
      mode_validation: PRODUCTION_MENSUELLE

